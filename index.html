<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#000">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wie Is De Lul">

<title>Wie Is De Lul</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Inter",
        Arial,
        sans-serif;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}


/* =========================================
   APP + THEMES
========================================= */

#app {
    position: fixed;
    inset: 0;

    overflow: hidden;

    --bg: radial-gradient(circle at 50% 50%, #090909 0%, #030303 48%, #000 100%);
    --text-color: #f5f5f5;

    background: var(--bg);
    transition: background 1s ease;
}

#app[data-theme="kerst"] {
    --bg: radial-gradient(circle at 50% 40%, #17241a 0%, #0d1710 45%, #060907 75%, #030302 100%);
    --text-color: #f5efe0;
}

#app[data-theme="zomer"] {
    --bg: radial-gradient(circle at 50% 28%, #fff1c9 0%, #ffd27d 45%, #ff9a5a 80%, #ff7f4d 100%);
    --text-color: #3a2200;
}

#title,
#countdown,
#winnerText {
    color: var(--text-color);
    transition: color .6s ease;
}


/* =========================================
   STAGE
========================================= */

#stage {
    position: absolute;
    inset: 0;
}


/* =========================================
   TITLE
========================================= */

#title {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    transform:
        translateY(-50%)
        scale(1);

    text-align: center;

    pointer-events: none;

    z-index: 5;

    font-size:
        clamp(43px, 13vw, 105px);

    font-weight: 850;

    letter-spacing: -.085em;

    line-height: .88;

    white-space: nowrap;

    transition:
        opacity .7s cubic-bezier(.16,1,.3,1),
        transform .8s cubic-bezier(.16,1,.3,1),
        filter .7s ease,
        color .6s ease;
}

#title.hidden {
    opacity: 0;

    transform:
        translateY(-50%)
        scale(.82);

    filter: blur(15px);
}


/* =========================================
   COUNTDOWN
========================================= */

#countdown {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.8);

    z-index: 10;

    pointer-events: none;

    font-size:
        clamp(65px, 20vw, 150px);

    font-weight: 750;

    letter-spacing: -.09em;

    opacity: 0;

    filter: blur(12px);

    font-variant-numeric:
        tabular-nums;

}


#countdown.show {

    animation:
        countdownIn
        .45s
        cubic-bezier(.16,1,.3,1)
        forwards;

}


@keyframes countdownIn {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.7);

        filter: blur(12px);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

        filter: blur(0);
    }

}


/* =========================================
   FINGER
========================================= */

.finger {

    position: absolute;

    width: 94px;
    height: 94px;

    margin-left: -47px;
    margin-top: -47px;

    border-radius: 50%;

    pointer-events: none;

    opacity: 0;

    transform:
        translate3d(0,0,0)
        rotate(0deg)
        scaleX(1)
        scaleY(1);

    transition: opacity .25s ease;

    will-change:
        left,
        top,
        transform,
        filter;

}


/* =========================================
   SOFT SHADOW
========================================= */

.finger::after {

    content: "";

    position: absolute;

    left: 13%;
    right: 13%;

    bottom: -9px;

    height: 15px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.55);

    filter:
        blur(11px);

    z-index: -1;
}


/* =========================================
   VISIBLE (bouncy jelly entrance)
========================================= */

.finger.visible {

    opacity: 1;
    animation: fingerIn .55s cubic-bezier(.19,1.6,.4,1) both;

}

@keyframes fingerIn {

    0% {
        transform: scale(.25,.25);
    }

    45% {
        transform: scale(1.35,.68);
    }

    65% {
        transform: scale(.82,1.26);
    }

    82% {
        transform: scale(1.12,.9);
    }

    100% {
        transform: scale(1,1);
    }

}


/* =========================================
   ROLLING GLOW
========================================= */

.finger.rolling {

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,255,255,.08)
        );

}


.finger.roll-active {

    filter:

        drop-shadow(
            0 0 13px
            rgba(255,255,255,.35)
        )

        drop-shadow(
            0 0 32px
            rgba(255,255,255,.20)
        )

        drop-shadow(
            0 0 65px
            rgba(255,255,255,.10)
        );

}


/* =========================================
   WINNER
========================================= */

.finger.winner {

    z-index: 20;

    filter:

        drop-shadow(
            0 0 18px
            rgba(255,255,255,.55)
        )

        drop-shadow(
            0 0 55px
            rgba(255,255,255,.3)
        );

}


/* =========================================
   LOSER
========================================= */

.finger.loser {

    opacity: 0 !important;

    transition:
        opacity .7s ease,
        filter .7s ease;

}


/* =========================================
   WINNER TEXT
========================================= */

#winnerText {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    transform:
        translateY(-50%)
        scale(.7);

    z-index: 30;

    pointer-events: none;

    text-align: center;

    font-size:
        clamp(42px, 13vw, 105px);

    font-weight: 850;

    letter-spacing: -.075em;

    opacity: 0;

    filter: blur(14px);
    padding: 0 24px;

}

#winnerText.multi {
    font-size: clamp(28px, 9vw, 68px);
}


#winnerText.show {

    animation:
        winnerText
        1.4s
        cubic-bezier(.16,1,.3,1)
        forwards;

}


@keyframes winnerText {

    0% {

        opacity: 0;

        transform:
            translateY(-50%)
            scale(.7);

        filter: blur(14px);

    }

    35% {

        opacity: 1;

        transform:
            translateY(-50%)
            scale(1.08);

        filter: blur(0);

    }

    65% {

        transform:
            translateY(-50%)
            scale(.98);

    }

    100% {

        opacity: 0;

        transform:
            translateY(-50%)
            scale(1);

    }

}


/* =========================================
   FLASH
========================================= */

#flash {

    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 50;

}


#flash.active {

    animation:
        flash .7s ease-out;

}


@keyframes flash {

    0% {
        opacity: 0;
    }

    10% {
        opacity: .13;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================
   MENU TOGGLE
========================================= */

#menuToggle {

    position: absolute;

    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 50%;

    transform: translateX(-50%);

    width: 44px;
    height: 26px;

    background: rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: none;
    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 40;

    transition: opacity .3s ease;
    -webkit-tap-highlight-color: transparent;
}

#menuToggle svg {
    width: 14px;
    height: 14px;
    transition: transform .35s cubic-bezier(.16,1,.3,1);
}

#menuToggle.open svg {
    transform: rotate(180deg);
}

#menuToggle.disabled {
    opacity: 0;
    pointer-events: none;
}


/* =========================================
   MENU PANEL
========================================= */

#menuPanel {

    position: absolute;

    top: calc(env(safe-area-inset-top, 0px) + 44px);
    left: 50%;

    width: min(300px, 84vw);

    transform: translateX(-50%) translateY(-14px);

    background: rgba(22,22,22,.82);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.08);

    padding: 18px;

    z-index: 41;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .35s cubic-bezier(.16,1,.3,1),
        transform .35s cubic-bezier(.16,1,.3,1);
}

#menuPanel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
}

.menu-section {
    margin-bottom: 16px;
}

.menu-section:last-child {
    margin-bottom: 0;
}

.menu-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
    margin-bottom: 10px;
}

.stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.07);
    border-radius: 12px;
    padding: 6px 6px;
}

.stepper button {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: none;
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
}

.stepper button:active {
    background: rgba(255,255,255,.22);
}

#winnerCountDisplay {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    min-width: 24px;
    text-align: center;
}

.theme-options {
    display: flex;
    gap: 8px;
}

.theme-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.75);
    font-size: 13px;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
}

.theme-btn.active {
    background: #fff;
    color: #111;
    border-color: #fff;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:500px) {

    .finger {

        width: 86px;
        height: 86px;

        margin-left: -43px;
        margin-top: -43px;

    }

}

</style>
</head>


<body>

<div id="app" data-theme="dark">

    <div id="stage"></div>

    <div id="title">
        WIE IS DE LUL
    </div>

    <div id="countdown"></div>

    <div id="winnerText"></div>

    <button id="menuToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 8L12 16L20 8" stroke="white" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div id="menuPanel">

        <div class="menu-section">
            <div class="menu-label">Aantal winnaars</div>
            <div class="stepper">
                <button id="winnerMinus">−</button>
                <span id="winnerCountDisplay">1</span>
                <button id="winnerPlus">+</button>
            </div>
        </div>

        <div class="menu-section">
            <div class="menu-label">Thema</div>
            <div class="theme-options">
                <button class="theme-btn active" data-theme="dark">Donker</button>
                <button class="theme-btn" data-theme="kerst">Kerst</button>
                <button class="theme-btn" data-theme="zomer">Zomer</button>
            </div>
        </div>

    </div>

    <div id="flash"></div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById("stage");

const title =
    document.getElementById("title");

const countdown =
    document.getElementById("countdown");

const winnerText =
    document.getElementById("winnerText");

const flash =
    document.getElementById("flash");

const appEl =
    document.getElementById("app");

const menuToggle =
    document.getElementById("menuToggle");

const menuPanel =
    document.getElementById("menuPanel");

const winnerMinus =
    document.getElementById("winnerMinus");

const winnerPlus =
    document.getElementById("winnerPlus");

const winnerCountDisplay =
    document.getElementById("winnerCountDisplay");


/* =========================================================
   THEMES (color palette + names per theme)
========================================================= */

const THEMES = {

    dark: [
        { hex: "#ff453a", name: "ROOD" },
        { hex: "#ff9f0a", name: "ORANJE" },
        { hex: "#ffd60a", name: "GEEL" },
        { hex: "#30d158", name: "GROEN" },
        { hex: "#64d2ff", name: "LICHTBLAUW" },
        { hex: "#0a84ff", name: "BLAUW" },
        { hex: "#bf5af2", name: "PAARS" },
        { hex: "#ff375f", name: "ROZE" }
    ],

    kerst: [
        { hex: "#d1263b", name: "KERSTROOD" },
        { hex: "#1f7a4d", name: "DENNENGROEN" },
        { hex: "#e8b84b", name: "GOUD" },
        { hex: "#f2f2f2", name: "SNEEUWWIT" },
        { hex: "#c7ccd1", name: "ZILVER" },
        { hex: "#a3283f", name: "BESSENROOD" },
        { hex: "#e0973a", name: "AMBER" },
        { hex: "#7fb8d9", name: "IJSBLAUW" }
    ],

    zomer: [
        { hex: "#ffd23f", name: "ZONGEEL" },
        { hex: "#ff6f59", name: "KORAAL" },
        { hex: "#2ec4b6", name: "TURKOOIS" },
        { hex: "#a7d129", name: "LIMOEN" },
        { hex: "#ff5d8f", name: "WATERMELOEN" },
        { hex: "#4cc9f0", name: "HEMELSBLAUW" },
        { hex: "#ffb703", name: "MANGO" },
        { hex: "#ff8fa3", name: "FLAMINGO" }
    ]

};


/* =========================================================
   SETTINGS
========================================================= */

const settings = {
    winnerCount: 1,
    theme: "dark"
};


/* =========================================================
   SOUND (smooth Web Audio tones)
========================================================= */

const SoundManager = (() => {

    let ctx = null;

    function ensure() {

        if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            ctx = new AC();
        }

        if (ctx.state === "suspended") {
            ctx.resume();
        }

        return ctx;

    }

    function tone(freq, startTime, duration, peakGain, type) {

        const c = ensure();
        if (!c) return;

        const osc = c.createOscillator();
        const gain = c.createGain();

        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain).connect(c.destination);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.03);

    }

    return {

        init() {
            ensure();
        },

        tap() {
            const c = ensure();
            if (!c) return;
            tone(420, c.currentTime, 0.08, 0.05, "sine");
        },

        countdownBeep() {
            const c = ensure();
            if (!c) return;
            tone(560, c.currentTime, 0.16, 0.07, "sine");
        },

        rollTick(pitch) {
            const c = ensure();
            if (!c) return;
            tone(320 * (pitch || 1), c.currentTime, 0.07, 0.045, "sine");
        },

        winnerChime() {
            const c = ensure();
            if (!c) return;
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((f, i) => {
                tone(f, c.currentTime + i * 0.1, 0.6, 0.08, "sine");
            });
        }

    };

})();


function vibrate(pattern) {
    if (navigator.vibrate) {
        navigator.vibrate(pattern);
    }
}


/* =========================================================
   STATE
========================================================= */

const fingers =
    new Map();

let countdownTimer = null;

let choosing = false;

let countdownStart = 0;

let lastCountdownSecond = null;

let nextPlayerColor = 0;


/* =========================================================
   MENU
========================================================= */

function updateMenuAvailability() {

    const allowed =
        !choosing &&
        countdownTimer === null;

    menuToggle.classList.toggle("disabled", !allowed);

    if (!allowed) {
        menuPanel.classList.remove("open");
        menuToggle.classList.remove("open");
    }

}

menuToggle.addEventListener("click", (e) => {

    e.stopPropagation();

    if (menuToggle.classList.contains("disabled"))
        return;

    const open =
        menuPanel.classList.toggle("open");

    menuToggle.classList.toggle("open", open);

});

winnerMinus.addEventListener("click", (e) => {
    e.stopPropagation();
    settings.winnerCount = Math.max(1, settings.winnerCount - 1);
    winnerCountDisplay.textContent = settings.winnerCount;
});

winnerPlus.addEventListener("click", (e) => {
    e.stopPropagation();
    settings.winnerCount = Math.min(4, settings.winnerCount + 1);
    winnerCountDisplay.textContent = settings.winnerCount;
});

document.querySelectorAll(".theme-btn").forEach((btn) => {

    btn.addEventListener("click", (e) => {

        e.stopPropagation();

        settings.theme = btn.dataset.theme;

        appEl.setAttribute("data-theme", settings.theme);

        document.querySelectorAll(".theme-btn").forEach((b) => {
            b.classList.toggle("active", b === btn);
        });

    });

});


/* =========================================================
   CREATE FINGER
========================================================= */

function createFinger(colorIndex) {

    const palette =
        THEMES[settings.theme] || THEMES.dark;

    const colorData =
        palette[colorIndex % palette.length];

    const el =
        document.createElement("div");

    el.className = "finger";
    el.style.background = colorData.hex;

    stage.appendChild(el);

    requestAnimationFrame(() => {

        el.classList.add(
            "visible"
        );

    });

    return { el, colorName: colorData.name };

}


/* =========================================================
   POSITION
========================================================= */

function positionFinger(finger) {

    finger.el.style.left =
        finger.x + "px";

    finger.el.style.top =
        finger.y + "px";

}


/* =========================================================
   JELLY PHYSICS (more intense + springy return)
========================================================= */

function updateJelly(finger) {

    const dx =
        finger.x -
        finger.lastX;

    const dy =
        finger.y -
        finger.lastY;

    const speed =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(dy, dx);

    /*
       Much more aggressive stretch:
       smaller divisor + higher cap.
    */

    const stretch =
        Math.min(
            speed / 42,
            0.62
        );

    const cos =
        Math.abs(Math.cos(angle));

    const sin =
        Math.abs(Math.sin(angle));

    let scaleX =
        1 + stretch * cos;

    let scaleY =
        1 + stretch * sin;

    scaleX +=
        stretch * .3;

    scaleY +=
        stretch * .3;

    const rotation =
        Math.max(
            -18,
            Math.min(
                18,
                dx * .45
            )
        );

    finger.el.style.transition = "none";

    finger.el.style.transform =

        `translate3d(0,0,0)
         rotate(${rotation}deg)
         scaleX(${scaleX})
         scaleY(${scaleY})`;

    /*
       Springy jelly return with overshoot,
       instead of a flat settle.
    */

    requestAnimationFrame(() => {

        if (!fingers.has(finger.id))
            return;

        finger.el.style.transition =
            "transform .5s cubic-bezier(.19,1.7,.3,1)";

        finger.el.style.transform =
            "translate3d(0,0,0) rotate(0deg) scaleX(1) scaleY(1)";

    });

    finger.lastX =
        finger.x;

    finger.lastY =
        finger.y;

}


/* =========================================================
   ADD FINGER
========================================================= */

function addFinger(touch) {

    if (choosing)
        return;

    SoundManager.init();

    const created =
        createFinger(
            nextPlayerColor++
        );

    const finger = {

        id:
            touch.identifier,

        x:
            touch.clientX,

        y:
            touch.clientY,

        lastX:
            touch.clientX,

        lastY:
            touch.clientY,

        el:
            created.el,

        colorName:
            created.colorName

    };

    positionFinger(
        finger
    );

    fingers.set(
        finger.id,
        finger
    );

    vibrate(8);
    SoundManager.tap();

    title.classList.add(
        "hidden"
    );

    updateMenuAvailability();

    if (
        fingers.size >= 2 &&
        !countdownTimer
    ) {

        startCountdown();

    }

}


/* =========================================================
   MOVE FINGER
========================================================= */

function moveFinger(touch) {

    const finger =
        fingers.get(
            touch.identifier
        );

    if (
        !finger ||
        choosing
    )
        return;

    finger.x =
        touch.clientX;

    finger.y =
        touch.clientY;

    positionFinger(
        finger
    );

    updateJelly(
        finger
    );

}


/* =========================================================
   REMOVE FINGER
========================================================= */

function removeFinger(id) {

    if (choosing)
        return;

    const finger =
        fingers.get(id);

    if (!finger)
        return;

    finger.el.classList.remove(
        "visible"
    );

    setTimeout(() => {

        finger.el.remove();

    }, 350);

    fingers.delete(id);

    if (fingers.size < 2) {

        cancelCountdown();

    }

    if (fingers.size === 0) {

        title.classList.remove(
            "hidden"
        );

        nextPlayerColor = 0;

    }

    updateMenuAvailability();

}


/* =========================================================
   START COUNTDOWN
========================================================= */

function startCountdown() {

    if (
        fingers.size < 2 ||
        choosing
    )
        return;

    countdownStart =
        performance.now();

    lastCountdownSecond = 3;

    countdown.textContent =
        "3.0";

    countdown.classList.remove(
        "show"
    );

    void countdown.offsetWidth;

    countdown.classList.add(
        "show"
    );

    countdownTimer =
        requestAnimationFrame(
            countdownLoop
        );

    updateMenuAvailability();

}


/* =========================================================
   COUNTDOWN LOOP
========================================================= */

function countdownLoop(now) {

    if (
        fingers.size < 2 ||
        choosing
    ) {

        countdownTimer = null;

        return;

    }

    const elapsed =
        now -
        countdownStart;

    const remaining =
        Math.max(
            0,
            3000 - elapsed
        );

    countdown.textContent =
        (remaining / 1000)
            .toFixed(1);

    const currentSecond =
        Math.ceil(remaining / 1000);

    if (
        currentSecond !== lastCountdownSecond &&
        currentSecond >= 0
    ) {

        lastCountdownSecond = currentSecond;

        vibrate(15);
        SoundManager.countdownBeep();

    }

    if (
        remaining <= 0
    ) {

        countdownTimer = null;

        countdown.classList.remove(
            "show"
        );

        choose();

        return;

    }

    countdownTimer =
        requestAnimationFrame(
            countdownLoop
        );

}


/* =========================================================
   CANCEL COUNTDOWN
========================================================= */

function cancelCountdown() {

    if (
        countdownTimer !== null
    ) {

        cancelAnimationFrame(
            countdownTimer
        );

        countdownTimer = null;

    }

    countdown.classList.remove(
        "show"
    );

    updateMenuAvailability();

}


/* =========================================================
   CHOOSE
========================================================= */

function choose() {

    if (
        choosing ||
        fingers.size < 2
    )
        return;

    choosing = true;

    updateMenuAvailability();

    cancelCountdown();

    const list =
        [...fingers.values()];

    list.forEach(finger => {

        finger.el.classList.add(
            "rolling"
        );

    });

    let current = 0;

    let delay = 75;

    let elapsed = 0;

    const rollDuration =
        4800;

    function roll() {

        if (
            elapsed >=
            rollDuration
        ) {

            finish();

            return;

        }

        list.forEach(finger => {

            finger.el.classList.remove(
                "roll-active"
            );

        });

        const active =
            list[
                current %
                list.length
            ];

        active.el.classList.add(
            "roll-active"
        );

        vibrate(4);

        SoundManager.rollTick(
            1 + (current % 5) * 0.06
        );

        current++;

        delay *=
            1.055;

        delay +=
            Math.random() * 7;

        elapsed +=
            delay;

        setTimeout(
            roll,
            delay
        );

    }

    roll();


    /* =====================================================
       FINISH
    ===================================================== */

    function finish() {

        /*
           Winners are selected
           only now — random shuffle.
        */

        const shuffled =
            [...list].sort(
                () => Math.random() - 0.5
            );

        const maxWinners =
            Math.max(1, list.length - 1);

        const winnerCount =
            Math.min(
                settings.winnerCount,
                maxWinners
            );

        const winners =
            shuffled.slice(0, winnerCount);

        const winnerSet =
            new Set(winners);

        list.forEach(finger => {

            finger.el.classList.remove(
                "rolling",
                "roll-active"
            );

        });

        list.forEach(finger => {

            if (
                !winnerSet.has(finger)
            ) {

                finger.el.classList.add(
                    "loser"
                );

            }

        });

        winners.forEach((winner, i) => {

            winner.el.classList.add(
                "winner"
            );

            winner.el.animate(

                [

                    { transform: "scale(1,1)" },
                    { transform: "scale(1.28,.76)" },
                    { transform: "scale(.86,1.18)" },
                    { transform: "scale(1.1,.92)" },
                    { transform: "scale(1,1)" }

                ],

                {
                    duration: 900,
                    delay: i * 60,
                    easing: "cubic-bezier(.16,1,.3,1)",
                    fill: "forwards"
                }

            );

        });

        setTimeout(() => {

            flash.classList.remove(
                "active"
            );

            void flash.offsetWidth;

            flash.classList.add(
                "active"
            );

            vibrate([30, 40, 30, 40, 120]);
            SoundManager.winnerChime();

            const names =
                winners.map(w => w.colorName);

            winnerText.textContent =
                names.join(" & ");

            winnerText.classList.toggle(
                "multi",
                names.length > 1
            );

            winnerText.classList.remove(
                "show"
            );

            void winnerText.offsetWidth;

            winnerText.classList.add(
                "show"
            );

        }, 350);

        setTimeout(() => {

            list.forEach(finger => {

                finger.el.remove();

            });

            fingers.clear();

            winnerText.classList.remove(
                "show"
            );

            choosing = false;

            nextPlayerColor = 0;

            title.classList.remove(
                "hidden"
            );

            updateMenuAvailability();

        }, 2100);

    }

}


/* =========================================================
   TOUCH START
========================================================= */

stage.addEventListener(

    "touchstart",

    event => {

        event.preventDefault();

        for (
            const touch
            of event.changedTouches
        ) {

            addFinger(touch);

        }

    },

    {
        passive: false
    }

);


/* =========================================================
   TOUCH MOVE
========================================================= */

stage.addEventListener(

    "touchmove",

    event => {

        event.preventDefault();

        for (
            const touch
            of event.changedTouches
        ) {

            moveFinger(touch);

        }

    },

    {
        passive: false
    }

);


/* =========================================================
   TOUCH END
========================================================= */

stage.addEventListener(

    "touchend",

    event => {

        event.preventDefault();

        for (
            const touch
            of event.changedTouches
        ) {

            removeFinger(
                touch.identifier
            );

        }

    },

    {
        passive: false
    }

);


/* =========================================================
   TOUCH CANCEL
========================================================= */

stage.addEventListener(

    "touchcancel",

    event => {

        event.preventDefault();

        for (
            const touch
            of event.changedTouches
        ) {

            removeFinger(
                touch.identifier
            );

        }

    },

    {
        passive: false
    }

);


/* =========================================================
   IOS GESTURES
========================================================= */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
);

document.addEventListener(
    "gesturechange",
    e => e.preventDefault()
);

document.addEventListener(
    "gestureend",
    e => e.preventDefault()
);

</script>
